<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="720" height="400" fill="#fff"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <!-- Raspberry Pi -->
    <rect x="20" y="110" width="140" height="240" rx="6"/>
    <!-- 12 V supply -->
    <rect x="600" y="40" width="100" height="310" rx="6"/>
    <!-- +12 V rail with fuse -->
    <path d="M600 60 H560"/>
    <rect x="510" y="52" width="50" height="16"/>
    <path d="M510 60 H420"/>
    <!-- buzzer -->
    <path d="M420 60 V90"/>
    <rect x="395" y="90" width="50" height="40"/>
    <path d="M420 130 V160"/>
    <!-- flyback diode, cathode to +12 V -->
    <path d="M420 60 H490 V88"/>
    <path d="M478 112 L502 112 L490 92 Z" fill="#222"/>
    <path d="M478 90 H502"/>
    <path d="M490 112 V160 H420"/>
    <!-- MOSFET -->
    <path d="M420 160 V185 H400"/>
    <path d="M400 178 V192 M400 197 V211 M400 216 V230"/>
    <path d="M400 223 H420 V260"/>
    <path d="M400 204 H420 V223"/>
    <path d="M404 204 L414 199 L414 209 Z" fill="#222"/>
    <path d="M390 180 V228"/>
    <!-- gate resistor and pull-down -->
    <path d="M160 160 H230"/>
    <rect x="230" y="152" width="50" height="16"/>
    <path d="M280 160 H330 V204 H390"/>
    <path d="M330 204 V240"/>
    <rect x="322" y="240" width="16" height="45"/>
    <path d="M330 285 V330"/>
    <!-- ground rail -->
    <path d="M160 330 H600"/>
    <path d="M420 260 V330"/>
  </g>
  <g fill="#222">
    <circle cx="420" cy="60" r="4"/>
    <circle cx="420" cy="160" r="4"/>
    <circle cx="330" cy="204" r="4"/>
    <circle cx="330" cy="330" r="4"/>
    <circle cx="420" cy="330" r="4"/>
  </g>
  <g fill="#222">
    <text x="90" y="100" text-anchor="middle" font-weight="bold">Raspberry Pi</text>
    <text x="30" y="155">GPIO17</text>
    <text x="30" y="173" font-size="12">(pin 11)</text>
    <text x="30" y="325">GND</text>
    <text x="30" y="343" font-size="12">(pin 9)</text>
    <text x="650" y="30" text-anchor="middle" font-weight="bold">12 V supply</text>
    <text x="608" y="65">+12 V</text>
    <text x="608" y="335">0 V</text>
    <text x="535" y="44" text-anchor="middle">F1 1 A</text>
    <text x="255" y="144" text-anchor="middle">R1 220 Ω</text>
    <text x="346" y="260">R2</text>
    <text x="346" y="276">100 kΩ</text>
    <text x="420" y="115" text-anchor="middle" font-size="13">BZ1</text>
    <text x="400" y="104" font-size="12">+</text>
    <text x="510" y="100">D1</text>
    <text x="510" y="116" font-size="12">1N4007</text>
    <text x="440" y="200">Q1</text>
    <text x="440" y="216" font-size="12">AO3400</text>
    <text x="440" y="232" font-size="12">N-MOSFET</text>
    <text x="370" y="198" font-size="12">G</text>
    <text x="428" y="178" font-size="12">D</text>
    <text x="428" y="255" font-size="12">S</text>
    <text x="380" y="365" text-anchor="middle" font-size="13">Common ground: connect the Pi's GND to the 12 V negative</text>
    <text x="385" y="115" text-anchor="end" font-size="12">12 V active buzzer</text>
  </g>
</svg>
